pre-commit:
  # 关闭并行：vue-tsc -b 在 Windows 下多进程并行会因资源竞争触发 Node 原生崩溃
  # （代码无类型错误，单独运行 vue-tsc -b 通过）。串行更稳。
  parallel: false
  commands:
    biome:
      glob: "apps/web/**/*.{js,ts,vue,json,css}"
      skip_empty: true
      fail_text: "Biome 检查未通过，请根据上方输出修复后再提交。"
      # npm_config_ignore_scripts 避免 pnpm exec 触发根 prepare(lefthook install)，
      # 否则并行执行时多个进程同时 rename .pnpm/lock.yaml 会在 Windows 下 EPERM 竞态失败
      env:
        npm_config_ignore_scripts: "true"
      run: pnpm --filter web exec biome check --write .

    eslint-vue:
      glob: "apps/web/**/*.vue"
      skip_empty: true
      fail_text: "ESLint 检查未通过，请根据上方输出修复后再提交。"
      # 使用 bash -c 包裹以确保 Windows 下 pnpm bin 路径解析正常，避免 'eslint: command not found'
      env:
        npm_config_ignore_scripts: "true"
      run: pnpm --filter web exec eslint --fix .

    typecheck:
      glob: "apps/web/**/*.{ts,vue}"
      skip_empty: true
      fail_text: "类型检查未通过（vue-tsc），请根据上方输出修复后再提交。"
      # NODE_OPTIONS 提升老生代内存上限，规避 vue-tsc -b 在大型项目下 Node 原生崩溃。
      # 用 pnpm --filter web exec 解析 web 工作区本地的 vue-tsc（与项目 TS 版本匹配），
      # 勿用 npx：npx 在 lefthook 下会解析到全局 npm 缓存里的 vue-tsc，与本机 TS 不兼容。
      env:
        npm_config_ignore_scripts: "true"
        NODE_OPTIONS: "--max-old-space-size=8192"
      run: pnpm --filter web exec vue-tsc -b

    # stylelint: 暂未安装，后续有 CSS 规范需求时再启用（见第 5 节）
    #   glob: "apps/web/**/*.{vue,css,scss}"
    #   skip_empty: true
    #   run: bash -c "pnpm --filter web exec stylelint --fix {staged_files}"

    gofmt:
      glob: "apps/server/**/*.go"
      cwd: apps/server
      skip_empty: true
      fail_text: "gofmt 格式化未通过，已自动修复，请重新暂存后提交。"
      # 必须在 apps/server 目录内用 "." 扫描整个后端模块来格式化。
      # 切勿用 {staged_files}：它是相对仓库根的路径（如 apps/server/pkg/xxx.go），
      # 与 cwd: apps/server 叠加会变成 apps/server/apps/server/pkg/xxx.go，
      # gofmt 找不到文件会卡在等待 stdin 输入（表现为终端 ANSI 乱码卡死）。
      run: gofmt -w .

    govet:
      glob: "apps/server/**/*.go"
      skip_empty: true
      fail_text: "go vet 检查未通过，请根据上方输出修复后再提交。"
      # go vet 是包级检查（接受包路径而非文件列表），不传 {staged_files}，
      # 固定用 ./... 扫描整个后端模块
      run: bash -c "cd apps/server && go vet ./..."

    # markdownlint-cli2：纯 JS（Node）实现的 Markdown 格式化 + 规则修复工具，
    # 用 --fix 只修可自动修复的格式/规则问题、不阻塞提交。
    # 用 {staged_files} 限定只重写本次暂存的 .md（含中文路径），不动历史文档。
    # 选纯 JS 而非纯 Go(markdownfmt) 的根因：Go 二进制在 Windows 下依赖系统
    # "Beta UTF-8" 区域开关才能正确打开中文路径，否则 os.Open 中文路径直接失败；
    # Node 在 Windows 走 UTF-16 系统调用，天然支持中文路径，无此坑。
    mdformat:
      glob: "**/*.md"
      skip_empty: true
      fail_text: "Markdown 已自动格式化，请重新暂存（git add）后提交。"
      # 直接由 lefthook 执行（不裹 bash -c）：lefthook 会自动对每个暂存文件加双引号，
      # 正确处理中文/空格路径。Windows Git Bash 下用 bash -c 包裹 pnpm exec 会导致
      # 命令被解析成裸 pnpm（打印帮助并以退出码 1 中止提交）。
      env:
        npm_config_ignore_scripts: "true"
      run: pnpm exec markdownlint-cli2 --fix {staged_files}

commit-msg:
  commands:
    commitlint:
      run: pnpm exec commitlint --edit {1}