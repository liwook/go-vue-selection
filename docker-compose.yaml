# 全栈一键部署：前端(Nginx) + 后端(Go) + PostgreSQL
# 使用：在仓库根目录执行
#   1. cp apps/server/.env.example apps/server/.env   # 填入 POSTGRES_PASSWORD 与 AUTH_JWT_SECRET
#   2. docker compose up -d --build
# 访问：http://localhost  （管理后台，/screen 为大屏）
# 说明：对外仅暴露 80（前端 Nginx），/api 由 Nginx 反代到 server:9000；
#       PostgreSQL 端口不暴露给宿主机，仅在 compose 网络内可达。

services:
  pg:
    image: postgres:18.3-alpine
    container_name: vue_admin_pg
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: vue_admin
      TZ: Asia/Shanghai
    volumes:
      - pgdata:/var/lib/postgresql/data
      # 首次启动（数据目录为空时）自动按字母序执行建表脚本
      - ./apps/server/init-sql/:/docker-entrypoint-initdb.d/
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d vue_admin"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: always
    networks:
      - app-net

  server:
    build:
      context: ./apps/server
      dockerfile: Dockerfile
    image: vue-admin-backend:latest
    container_name: vue_admin_backend
    restart: always
    environment:
      TZ: Asia/Shanghai
      # 容器内日志打到 stdout，由 docker 日志系统采集
      VUE_ADMIN_LOG_OUTPUT: "stdout"
      # 以下环境变量覆盖 etc/config.yaml，使后端连到 compose 内的 pg
      VUE_ADMIN_POSTGRES_HOST: pg
      VUE_ADMIN_POSTGRES_PORT: "5432"
      VUE_ADMIN_POSTGRES_USER: postgres
      VUE_ADMIN_POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      VUE_ADMIN_POSTGRES_DBNAME: vue_admin
      # 覆盖 example 里的 CHANGE_ME 占位密钥，避免生产使用弱默认密钥
      VUE_ADMIN_AUTH_JWT_SECRET: ${AUTH_JWT_SECRET}
    # 健康检查存活探针
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9000/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    depends_on:
      pg:
        condition: service_healthy
    networks:
      - app-net

  web:
    build:
      # 上下文为仓库根目录，才能解析 pnpm workspace（apps/*）
      context: .
      dockerfile: apps/web/Dockerfile
    image: vue-admin-web:latest
    container_name: vue_admin_web
    restart: always
    # 仅暴露前端 80，/api 由容器内 Nginx 反代到 server:9000
    ports:
      - "80:80"
    depends_on:
      server:
        condition: service_healthy
    networks:
      - app-net

volumes:
  pgdata:

networks:
  app-net:
    driver: bridge
