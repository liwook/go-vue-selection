server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ===== Gzip 压缩（echarts 等 chunk 可压到 20%-30%）=====
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        application/x-javascript
        image/svg+xml;

    # 前端路由 fallback 到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 带 hash 的静态资源（JS/CSS/图片/字体）：内容不变，长期缓存
    # 普通前缀会被上面的正则段截胡，故用 ^~ 保证 /api 开头的请求一律走代理
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?|eot|ttf|map)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # 反向代理后端接口：proxy_pass 末尾不带 /，保留 /api 前缀原样转发
    # 用 ^~ 防止正则静态段截胡 /api/*.png 等请求导致 404
    location ^~ /api/ {
        proxy_pass http://server:9000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 生产级加分项
        proxy_buffering off;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 60s;
        proxy_redirect off;
    }
}
